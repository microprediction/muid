name: test

on:
  push:
    branches: [master]
  pull_request:

# Read-only token; no job needs to write anything.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      # Actions are pinned by commit SHA, never by a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts
      - name: Registry signatures
        run: npm audit signatures
      - name: Tests with full coverage of the core
        run: >-
          node --test --experimental-test-coverage --test-coverage-include='src/**' --test-coverage-include='adapter/**'
          --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100
          "tests/!(meta)/*.test.mjs"

  twins:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite:
          - adapter-twins.test.mjs
          - assertion-twins.test.mjs
          - attestation-twins.test.mjs
          - bytes-twins.test.mjs
          - delegation-twins.test.mjs
          - ed25519-twins.test.mjs
          - encoding-twins.test.mjs
          - envelope-twins.test.mjs
          - membership-twins.test.mjs
          - origin-twins.test.mjs
          - p256-twins.test.mjs
          - root-twins.test.mjs
          - verifier-twins.test.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts
      - name: Broken twins (each must make its suite fail)
        run: node --test "tests/meta/${{ matrix.suite }}"

  mutation:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - stryker.config.json
          - stryker.envelope.config.json
          - stryker.ed25519.config.json
          - stryker.p256.config.json
          - stryker.adapter.config.json
          - stryker.assertion.config.json
          - stryker.origin.config.json
          - stryker.delegation.config.json
          - stryker.root.config.json
          - stryker.bytes.config.json
          - stryker.attestation.config.json
          - stryker.membership.config.json
          - stryker.verifier.config.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts
      - name: Mutation testing (fails below the break threshold in the config)
        run: npx --no-install stryker run ${{ matrix.config }}
        env:
          FC_RUNS: '60'
