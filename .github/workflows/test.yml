name: test

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 6 * * *' # nightly, every mutation config whatever changed
  workflow_dispatch:

# Read-only token; no job needs to write anything.
permissions:
  contents: read

concurrency:
  group: test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # a hang fails the job instead of holding it for six hours
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      # Actions are pinned by commit SHA, never by a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # Go runs the transparency log (Tessera, pinned in log/go.mod and log/go.sum) for tests/log/. No cache.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: log/go.mod
          cache: false
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts
      - name: Registry signatures
        # Once, with the newest npm: older npm releases lack newer registry attestation keys.
        if: matrix.node == '26'
        run: npm audit signatures
      # A test that never ends fails at five minutes, and a file whose tests have ended exits though a browser is left open.
      - name: Tests with full coverage of the core
        run: >-
          node --test --test-timeout=300000 --test-force-exit --experimental-test-coverage --test-coverage-include='src/**' --test-coverage-include='adapter/**' --test-coverage-include='witness/**' --test-coverage-include='id/records.js' --test-coverage-include='demo/**'
          --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100
          "tests/!(meta)/*.test.mjs"

  twins:
    runs-on: ubuntu-24.04
    timeout-minutes: 60 # a hang fails the job instead of holding it for six hours
    strategy:
      fail-fast: false
      matrix:
        # The slow harnesses run in jobs of their own; the quick ones share jobs, run one after another, so a push
        # takes a dozen runner slots rather than forty.
        suite:
          - tests/meta/id-twins.test.mjs
          - tests/meta/witness-twins.test.mjs
          - >-
            tests/meta/membership-twins.test.mjs tests/meta/root-twins.test.mjs tests/meta/p256-twins.test.mjs
            tests/meta/origin-twins.test.mjs tests/meta/note-twins.test.mjs tests/meta/merkle-twins.test.mjs
          - >-
            tests/meta/verifier-twins.test.mjs tests/meta/encoding-twins.test.mjs tests/meta/ed25519-twins.test.mjs
            tests/meta/demo-twins.test.mjs tests/meta/adapter-twins.test.mjs tests/meta/envelope-twins.test.mjs
            tests/meta/delegation-twins.test.mjs tests/meta/bytes-twins.test.mjs tests/meta/attestation-twins.test.mjs
            tests/meta/assertion-twins.test.mjs tests/meta/receipt-twins.test.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts
      - name: Broken twins (each must make its suite fail)
        run: node --test --test-concurrency=1 ${{ matrix.suite }}

  # A pull request runs the mutation configs whose inputs it changes (tests/mutation-plan.mjs); a push to master, the
  # nightly run and a manual run take every config.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # a pull request is checked out as a merge commit: its first parent is the base it changes
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Mutation configs to run
        id: plan
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
            jobs=$(node tests/mutation-plan.mjs "$RUNNER_TEMP/changed.txt")
          else
            jobs=$(node tests/mutation-plan.mjs)
          fi
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "$jobs"

  mutation:
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 150 # a hang fails the job instead of holding it for six hours
    strategy:
      fail-fast: false
      matrix:
        # The slow configs alone, the quick ones together (JOBS in tests/mutation-plan.mjs).
        config: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts
      - name: Mutation testing (fails below the break threshold in the config)
        # Every config in the group runs, and the job fails if any one of them falls below its threshold.
        run: |
          status=0
          for c in ${{ matrix.config }}; do npx --no-install stryker run "$c" || status=1; done
          exit $status
        env:
          FC_RUNS: '60'
