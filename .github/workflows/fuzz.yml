name: fuzz

# SPEC §12, scheduled and not gating: every property test (fast-check) at a high run count, with a new seed each
# night. A failure prints FC_SEED and the counterexample's path; rerun the file with that FC_SEED and FC_RUNS to replay it.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: fast-check runs per property
        default: '20000'

# Read-only token; nothing is uploaded.
permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts
      - name: Every property test, at a high run count and a new seed
        env:
          RUNS: ${{ inputs.runs || '20000' }}
        run: |
          case "$RUNS" in ''|*[!0-9]*) echo "runs must be a number"; exit 1;; esac
          export FC_RUNS="$RUNS" FC_SEED=$(( GITHUB_RUN_ID % 2147483647 ))
          echo "FC_SEED=$FC_SEED FC_RUNS=$FC_RUNS"
          # The encoding suite draws its properties from tests/encoding/arbitraries.mjs, so all of it runs.
          node --test tests/encoding/*.test.mjs $(grep -l "from 'fast-check'" tests/*/*.test.mjs | grep -v -e '^tests/encoding/' -e '^tests/meta/')
