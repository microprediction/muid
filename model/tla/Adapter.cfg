\* Two workers whose clocks differ by 2 s, Grace at that difference (SPEC §7: the largest difference between
\* instances). Small windows keep the state space exhaustive.
CONSTANTS
  Workers = {1, 2}
  Names = {1}
  MaxTime = 6
  DelegExp = 6
  KeyExp = 6
  MaxStaleness = 2
  MaxClaimAge = 2
  Skew = 1
  MaxOffset = 1
  Grace = 2
  Offset <- AdapterOffset
  CheckClaimAtCommit = TRUE
  CheckDelegAtCommit = TRUE
  CheckHeadAtCommit = TRUE
  CheckKeyAtCommit = TRUE
  Tighten = 0
SPECIFICATION Spec
INVARIANTS TypeOK AtMostOnce NoExpiredAuthorizationAtCommit FreshnessBound
PROPERTIES NoRevival
