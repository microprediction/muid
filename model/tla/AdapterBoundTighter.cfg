\* Negative control: FreshnessBound's limit one second tighter. TLC must report it violated, so the limit, MaxStaleness
\* plus the clock difference after the revocation, is reached and cannot be improved.
CONSTANTS
  Workers = {1, 2}
  Names = {1}
  MaxTime = 6
  DelegExp = 6
  KeyExp = 6
  MaxStaleness = 2
  MaxClaimAge = 2
  Skew = 1
  MaxOffset = 1
  Grace = 2
  Offset <- AdapterOffset
  CheckClaimAtCommit = TRUE
  CheckDelegAtCommit = TRUE
  CheckHeadAtCommit = TRUE
  CheckKeyAtCommit = TRUE
  Tighten = 1
SPECIFICATION Spec
INVARIANTS FreshnessBound
