\* Negative control: the delegation's window not checked at the transaction (the adapter as it was, found by review). A
\* request that waits past the delegation's expiry is authorised: TLC must report NoExpiredAuthorizationAtCommit
\* violated. The witness key outlasts the delegation here, so that only the delegation's deadline passes.
CONSTANTS
  Workers = {1, 2}
  Names = {1}
  MaxTime = 6
  DelegExp = 5
  KeyExp = 9
  MaxStaleness = 2
  MaxClaimAge = 2
  Skew = 1
  MaxOffset = 1
  Grace = 2
  Offset <- AdapterOffset
  CheckClaimAtCommit = TRUE
  CheckDelegAtCommit = FALSE
  CheckHeadAtCommit = TRUE
  CheckKeyAtCommit = TRUE
  Tighten = 0
  HonestWitness = TRUE
  RememberRevocations = TRUE
SPECIFICATION Spec
INVARIANTS NoExpiredAuthorizationAtCommit
