\* A witness that may leave the revocation out of the heads it signs after it. A relying party cannot know of a
\* revocation no head showed it, so FreshnessBound is not checked; one it has seen holds (NoRevival, R10).
\* One second shorter than Adapter.cfg, which keeps it to minutes (15,193,611 distinct states); at Adapter.cfg's
\* bound it was run once to the end: 102,366,097 distinct states, no error.
CONSTANTS
  Workers = {1, 2}
  Names = {1}
  MaxTime = 5
  DelegExp = 5
  KeyExp = 5
  MaxStaleness = 2
  MaxClaimAge = 2
  Skew = 1
  MaxOffset = 1
  Grace = 2
  Offset <- AdapterOffset
  CheckClaimAtCommit = TRUE
  CheckDelegAtCommit = TRUE
  CheckHeadAtCommit = TRUE
  CheckKeyAtCommit = TRUE
  Tighten = 0
  HonestWitness = FALSE
  RememberRevocations = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoRevival AtMostOnce NoExpiredAuthorizationAtCommit
