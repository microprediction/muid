\* Negative control: Transactional off, two tabs. NoLostUpdate must be violated.
CONSTANTS
  a = a
  b = b
  x = x
  y = y
  k1 = k1
  k2 = k2
  t1 = t1
  t2 = t2
  Tabs = {t1, t2}
  Agents = {a}
  Auds = {x}
  Keys = {k1, k2}
  InitRows <- IdPageOne
  MaxTime = 1
  Life = 1
  MaxOps = 2
  MaxTotal = 2
  MaxIO = 2
  MaxRev = 3
  Transactional = FALSE
  FreshWrite = TRUE
  ForgetExact = TRUE
  CheckReviewed = TRUE
  CheckChanged = TRUE
  CompareRev = TRUE
  CheckExpiry = TRUE
  GuardReplies = TRUE
  PublishAfterCommit = TRUE
  WithdrawOnChange = TRUE
  ViewFromStore = TRUE
SPECIFICATION Spec
CONSTRAINT Bounded
SYMMETRY TabsAlike
INVARIANTS NoLostUpdate
