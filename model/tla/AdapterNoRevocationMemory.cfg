\* Negative control: the store keeps only the last head (the adapter as it was, found by a probe). Under a witness
\* that leaves the revocation out of a later head, that head becomes the memory and the revoked delegation is
\* dispatched from the next request on: TLC must report NoRevival violated.
CONSTANTS
  Workers = {1, 2}
  Names = {1}
  MaxTime = 6
  DelegExp = 6
  KeyExp = 6
  MaxStaleness = 2
  MaxClaimAge = 2
  Skew = 1
  MaxOffset = 1
  Grace = 2
  Offset <- AdapterOffset
  CheckClaimAtCommit = TRUE
  CheckDelegAtCommit = TRUE
  CheckHeadAtCommit = TRUE
  CheckKeyAtCommit = TRUE
  Tighten = 0
  HonestWitness = FALSE
  RememberRevocations = FALSE
SPECIFICATION Spec
INVARIANTS NoRevival
