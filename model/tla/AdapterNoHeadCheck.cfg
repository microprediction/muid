\* Negative control: the head's freshness not checked at the transaction (the adapter as it was, found by review). A
\* request that waits until its head is too old is authorised: TLC must report NoExpiredAuthorizationAtCommit violated.
CONSTANTS
  Workers = {1, 2}
  Names = {1}
  MaxTime = 6
  DelegExp = 6
  KeyExp = 6
  MaxStaleness = 2
  MaxClaimAge = 2
  Skew = 1
  MaxOffset = 1
  Grace = 2
  Offset <- AdapterOffset
  CheckClaimAtCommit = TRUE
  CheckDelegAtCommit = TRUE
  CheckHeadAtCommit = FALSE
  CheckKeyAtCommit = TRUE
  Tighten = 0
SPECIFICATION Spec
INVARIANTS NoExpiredAuthorizationAtCommit
