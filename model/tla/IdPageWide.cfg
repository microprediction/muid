\* The page as it is, two tabs, two reviews each: too large to finish (stopped at 325 million distinct states, no error); sampled by random walks, nightly.
CONSTANTS
  a = a
  b = b
  x = x
  y = y
  k1 = k1
  k2 = k2
  t1 = t1
  t2 = t2
  Tabs = {t1, t2}
  Agents = {a}
  Auds = {x}
  Keys = {k1, k2}
  InitRows <- IdPageOne
  MaxTime = 1
  Life = 1
  MaxOps = 2
  MaxTotal = 4
  MaxIO = 2
  MaxRev = 3
  Transactional = TRUE
  FreshWrite = TRUE
  ForgetExact = TRUE
  CheckReviewed = TRUE
  CheckChanged = TRUE
  CompareRev = TRUE
  CheckExpiry = TRUE
  GuardReplies = TRUE
  PublishAfterCommit = TRUE
  WithdrawOnChange = TRUE
  ViewFromStore = TRUE
SPECIFICATION Spec
CONSTRAINT Bounded
SYMMETRY TabsAlike
INVARIANTS TypeOK OneKeyPerAgent NoLostUpdate NoResurrection ViewHonest NoRevival ShownIsSaved ReviewedStateIsCurrent SavedBeforeHandover Unexpired
