\* Negative control: the claim's until not checked at the transaction (the adapter as it was). A request that waits
\* between its two steps outlives its id's stay in the store: TLC must report AtMostOnce violated.
CONSTANTS
  Workers = {1, 2}
  Names = {1}
  MaxTime = 6
  DelegExp = 6
  MaxStaleness = 2
  MaxClaimAge = 2
  Skew = 1
  MaxOffset = 1
  Grace = 2
  Offset <- AdapterOffset
  CheckAtCommit = FALSE
  Tighten = 0
SPECIFICATION Spec
INVARIANTS AtMostOnce
