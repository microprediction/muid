\* Negative control: the witness key's window not checked at the transaction (the adapter as it was, found by review).
\* A request that waits past the end of the key's window is authorised: TLC must report NoExpiredAuthorizationAtCommit
\* violated. The delegation outlasts the key here, so that only the key's deadline passes.
CONSTANTS
  Workers = {1, 2}
  Names = {1}
  MaxTime = 6
  DelegExp = 9
  KeyExp = 5
  MaxStaleness = 2
  MaxClaimAge = 2
  Skew = 1
  MaxOffset = 1
  Grace = 2
  Offset <- AdapterOffset
  CheckClaimAtCommit = TRUE
  CheckDelegAtCommit = TRUE
  CheckHeadAtCommit = TRUE
  CheckKeyAtCommit = FALSE
  Tighten = 0
  HonestWitness = TRUE
  RememberRevocations = TRUE
SPECIFICATION Spec
INVARIANTS NoExpiredAuthorizationAtCommit
