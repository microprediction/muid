\* Negative control: Grace below the 2 s between the workers' clocks. A worker whose clock is ahead drops a consumed
\* id that the other still accepts, so a replay is dispatched twice: TLC must report AtMostOnce violated.
CONSTANTS
  Workers = {1, 2}
  Names = {1}
  MaxTime = 6
  DelegExp = 6
  MaxStaleness = 2
  MaxClaimAge = 2
  Skew = 1
  MaxOffset = 1
  Grace = 0
  Offset <- AdapterOffset
  CheckAtCommit = TRUE
  Tighten = 0
SPECIFICATION Spec
INVARIANTS AtMostOnce
